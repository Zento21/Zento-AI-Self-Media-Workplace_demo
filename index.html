<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zento AI自媒体工作台 · 交互演示</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231D8F92'/%3E%3Cstop offset='1' stop-color='%230F4A4B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='1' width='46' height='46' rx='12' fill='url(%23g)'/%3E%3Cpath d='M14 16 H34 L14 32 H34' fill='none' stroke='%23FDFDFB' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='14' cy='16' r='2.4' fill='%23FDFDFB'/%3E%3Ccircle cx='34' cy='32' r='3.6' fill='%23FDFDFB'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --surface-ink:#F3F3EF;
  --ink:#202A30; --ink-3:#59656B; --ink-4:#657176;
  --line:#DFE4E1; --line-soft:#E9EDE9;
  --accent:#176B75; --accent-ink:#145F68; --accent-soft:rgba(23,107,117,.09);
  --success:#2F7D5C; --warning:#B8873A; --danger:#B3402A;
  --shadow:0 1px 2px rgba(32,42,48,.05); --shadow-hover:0 3px 12px rgba(32,42,48,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-variant-numeric:tabular-nums}
a{color:var(--accent-ink)}
/* ── 顶条 ── */
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:20}
.top .mark{width:26px;height:26px;flex:none}
.top b{font-size:15px;letter-spacing:-.01em}
.mbtn2{border:none;background:none;padding:7px;border-radius:8px;color:var(--ink-3);cursor:pointer;display:inline-flex;margin-left:-4px}
  .mbtn2:hover{background:var(--accent-soft);color:var(--accent-ink)}
  .top .demo-tag{margin-left:auto;font-size:12px;color:var(--ink-4);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.top .gh{font-size:12.5px;color:var(--ink-3);text-decoration:none}
.top .gh:hover{color:var(--accent-ink)}
/* ── 应用（首屏主体）── */
.shell{display:grid;grid-template-columns:172px 1fr;gap:0;background:var(--surface);min-height:calc(100vh - 51px)}
.side{background:var(--surface-ink);border-right:1px solid var(--line-soft);padding:14px 8px 12px;display:flex;flex-direction:column;gap:2px}
  .shell.narrow{grid-template-columns:0 1fr}
  .shell.narrow .side{display:none}
.brand{display:flex;gap:9px;align-items:center;padding:2px 8px 12px}
.brand .mark{width:28px;height:28px;flex:none}
.brand strong{font-size:13.5px;white-space:nowrap}
.side input{margin:0 2px 12px;padding:7px 10px;border:1px solid transparent;border-radius:10px;background:var(--surface);
  font:inherit;font-size:12.5px;color:var(--ink);outline:none;width:100%}
.side input:focus{border-color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:9px;padding:7px 10px;border:none;background:none;border-radius:9px;
  color:var(--ink-3);font:inherit;font-size:13px;cursor:pointer;text-align:left;transition:all .16s ease-out}
.nav button:hover{background:var(--accent-soft);color:var(--accent-ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav svg{width:15px;height:15px;flex:none}
.main{padding:22px 30px 40px;min-width:0;position:relative}
  .sfab{position:absolute;top:18px;right:30px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px;color:var(--ink-3);cursor:pointer;display:inline-flex;transition:all .16s ease-out;z-index:5}
  .sfab:hover{border-color:var(--accent);color:var(--accent-ink)}
.view{display:none}.view.on{display:block}
.vtitle{font-size:16px;font-weight:650;margin:0 0 14px}
/* 简报：无边框排版（与卡片区拉开质感层次）*/
.brief-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 28px;margin-bottom:30px}
.brief-sec h4{margin:0 0 2px;font-size:11.5px;color:var(--ink-4);font-weight:600;letter-spacing:.04em}
.brief-item{display:flex;gap:8px;align-items:baseline;padding:4.5px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;line-height:1.45}
.brief-item:last-child{border:none}
.brief-item b{color:var(--accent);min-width:18px;text-align:right;font-weight:600}
/* 流水线 pills */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);background:var(--surface);cursor:pointer;transition:all .16s ease-out}
.pill:hover{border-color:var(--accent);color:var(--accent-ink)}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
.pill b{font-family:ui-monospace,'SF Mono',Menlo,monospace}
/* 内容单流水线（对齐真实系统 co-* 结构）*/
.co-pipeline{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.co-stage{font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);background:var(--surface);cursor:pointer;transition:all .16s ease-out}
.co-stage:hover{border-color:var(--accent);color:var(--accent-ink)}
.co-stage.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
.co-stage b{font-family:ui-monospace,'SF Mono',Menlo,monospace;margin-left:2px}
.co-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:12px 16px;transition:all .16s ease-out}
.co-card:hover{box-shadow:var(--shadow-hover)}
.co-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-4);margin-bottom:5px}
.co-badge{font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.co-badge.gate-ok{color:var(--success);background:rgba(47,125,92,.1)}
.co-badge.gate-bad{color:var(--warning);background:rgba(184,135,58,.12)}
.co-platform{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink-3)}
.co-platform.done{border-color:transparent;background:rgba(47,125,92,.1);color:var(--success)}
.co-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.co-dialog{border:1px solid var(--line);border-radius:16px;padding:20px 22px;max-width:560px;width:calc(100vw - 48px);box-shadow:0 12px 48px rgba(32,42,48,.18)}
.co-dialog::backdrop{background:rgba(32,42,48,.32)}
.co-claim{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;line-height:1.5}
.co-claim:last-child{border:none}
.co-claim .ev{white-space:nowrap;font-size:12px;color:var(--accent-ink)}
/* 卡片（队列/内容单/候选 统一质感）*/
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.qcard,.cand{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:12px 16px;box-shadow:none;transition:all .16s ease-out;cursor:pointer}
.qcard:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.cand{cursor:default;margin-bottom:10px}
.cout{opacity:.35}
.qmeta{font-size:12px;color:var(--ink-4);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qmeta b{color:var(--accent-ink);font-weight:600}
.qtitle{font-size:15px;font-weight:650;margin:0 0 4px;line-height:1.45}
.qdesc{font-size:13px;color:var(--ink-3);line-height:1.55}
.qacts{margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:12.5px;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;transition:all .16s ease-out}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-ink)}
.badge{font-size:10.5px;padding:1.5px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.txt{border:none;background:none;color:var(--ink-4);font:inherit;font-size:12.5px;cursor:pointer;padding:0}
.txt:hover{color:var(--ink-2)}
/* 弹层 */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(620px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(32,42,48,.35)}
.dlg{padding:20px 22px}
.dlg h3{margin:0 0 2px;font-size:15.5px}
.tl{border-left:2px solid var(--line);padding-left:14px;display:grid;gap:7px;margin:8px 0 14px}
.tl .s{position:relative;font-size:12.5px;color:var(--ink-3)}
.tl .s::before{content:'';position:absolute;left:-19px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.claim{display:flex;gap:8px;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;align-items:baseline}
.claim .ev{flex:none}
.claim .ev a{font-size:11.5px;text-decoration:none}
.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 14px}
.gate{border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:11.5px}
.gate b{display:block;font-size:12px;margin-bottom:2px}
.gate.pass{border-color:rgba(47,125,92,.35);background:rgba(47,125,92,.07)}
.gate.fail{border-color:rgba(179,64,42,.35);background:rgba(179,64,42,.06)}
.gate.pass b{color:var(--success)}.gate.fail b{color:var(--danger)}
.station{background:var(--surface-ink);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--ink-3);line-height:1.7;margin-bottom:14px}
.station b{color:var(--accent-ink)}
/* ⌘K */
#ck{position:fixed;inset:0;z-index:50;display:none}
#ck.open{display:block}
#ck .bd{position:absolute;inset:0;background:rgba(32,42,48,.32)}
#ck .pn{position:relative;margin:12vh auto 0;width:min(560px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(28,39,51,.14);overflow:hidden}
#ck input{width:100%;border:none;outline:none;padding:14px 16px;font-size:15px;font-family:inherit;color:var(--ink);background:transparent}
#ck .ls{max-height:46vh;overflow:auto;border-top:1px solid var(--line-soft)}
.ci{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13.5px;cursor:pointer}
.ci.sel{background:var(--accent-soft)}
.ci .k{margin-left:auto;font-size:11px;color:var(--ink-4);border:1px solid var(--line);border-radius:999px;padding:1px 8px;flex:none}
/* 真实系统（应用下方，窄幅）*/
/* —— 情报 feed —— */
.feedwrap{display:grid;grid-template-columns:1fr 240px;gap:24px}
.fday{font-size:13px;font-weight:650;color:var(--ink-3);margin:6px 0 10px;display:flex;gap:8px;align-items:baseline}
.fday span{font-weight:400;font-size:12px;color:var(--ink-4)}
.fitem{border-left:2px solid var(--line);padding:2px 0 14px 16px;position:relative;cursor:pointer}
.fitem::before{content:'';position:absolute;left:-5px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.fitem:hover::before{border-color:var(--accent)}
.fmeta{font-size:12px;color:var(--ink-4);margin-bottom:3px}
.fmeta b{color:var(--accent-ink);font-weight:600}
.ftitle{font-size:15px;font-weight:650;line-height:1.5;display:flex;gap:8px;align-items:baseline}
.ftitle .badge{flex:none;transform:translateY(-1px)}
.fsum{font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.55}
.fcluster{font-size:12px;color:var(--accent);margin-top:4px}
.hotside{border-left:1px solid var(--line-soft);padding-left:20px}
.hot-title{font-size:12px;font-weight:650;color:var(--ink-4);letter-spacing:.1em;margin-bottom:10px}
.fmeta{font-size:12px;color:var(--ink-4)}
.srcrow{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12.5px;border-bottom:1px solid var(--line-soft)}
.srcrow:last-child{border:none}
.srcrow .dot{width:7px;height:7px;border-radius:50%;flex:none}
.srcrow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcrow .st{font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:3px;height:56px}
.bars .bar{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;position:relative;min-height:3px}
.bars .bar:hover{background:var(--accent)}
.legend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-4);margin-top:4px}
.hrow{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;line-height:1.45}
.hrow b{font-family:ui-monospace,Menlo,monospace;flex:none;width:14px}
.hrow span{flex:1;color:var(--ink-2)}
.hrow em{font-style:normal;font-family:ui-monospace,Menlo,monospace;color:var(--danger);font-size:11px}
.hrow i{font-style:normal;font-family:ui-monospace,Menlo,monospace;color:var(--ink-4);font-size:11px}
/* —— 创作工作台 —— */
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.step{font-size:12.5px;padding:5px 13px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);cursor:pointer;background:var(--surface)}
.step.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.step.done{border-color:transparent;background:var(--accent-soft);color:var(--accent-ink)}
.snav{display:flex;justify-content:space-between;margin-top:18px}
.draft{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:22px 26px;font-size:14.5px;line-height:1.8;max-width:640px}
.pubview{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:28px 30px;max-width:480px}
.pubview h1{font-size:21px;margin:0 0 6px}
.pmeta{font-size:12px;color:var(--ink-4);margin-bottom:14px}
.pubview p{font-size:14px;line-height:1.9;margin:0 0 12px;color:var(--ink-2)}
/* —— 数据 —— */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 12px}
.stat3{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:14px 18px}
.stat3 b{font-size:24px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.stat3 span{font-size:12px;color:var(--ink-4)}
.stat3 em{font-style:normal;color:var(--success)}
.dtable{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
.dtable th{text-align:left;font-weight:600;color:var(--ink-4);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.dtable td{padding:9px 10px;border-bottom:1px solid var(--line-soft)}
@media(max-width:860px){.feedwrap{grid-template-columns:1fr}.hotside{border:none;padding-left:0}.stats3{grid-template-columns:1fr}}
.real{max-width:860px;margin:56px auto 0;padding:0 20px}
.real .lbl{font-size:12px;font-weight:650;color:var(--ink-4);letter-spacing:.14em;margin-bottom:10px}
.real img{width:100%;display:block;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
footer{max-width:860px;margin:26px auto 56px;padding:0 20px;font-size:12.5px;color:var(--ink-4);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
kbd{border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11px;background:var(--surface-ink)}
/* 移动端 */
.mbar{display:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(32,42,48,.35);z-index:40}
@media(max-width:860px){
.shell{grid-template-columns:1fr;min-height:none}
.side{position:fixed;left:0;top:0;bottom:0;width:216px;z-index:50;transform:translateX(-100%);transition:transform .2s ease-out;box-shadow:0 0 40px rgba(28,39,51,.18);padding:16px 12px}
.side.open{transform:translateX(0)}
.scrim.on{display:block}
.mbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--surface);z-index:30}
.mbar .mb-brand{font-weight:700;font-size:14px;flex:1}
.mbtn{border:none;background:none;padding:8px;border-radius:9px;color:var(--ink-2);cursor:pointer;display:inline-flex}
.mbtn:active{background:var(--accent-soft)}
.main{padding:14px 16px 32px}
.qgrid{grid-template-columns:1fr}
.gates{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header class="top">
  <button class="mbtn2" onclick="togglePanel()" aria-label="折叠/展开侧栏" title="折叠/展开侧栏（\）"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></button>
  <svg class="mark" viewBox="0 0 48 48"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D8F92"/><stop offset="1" stop-color="#0F4A4B"/></linearGradient></defs><rect x="1" y="1" width="46" height="46" rx="12" fill="url(#g)"/><path d="M14 16 H34 L14 32 H34" fill="none" stroke="#FDFDFB" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="16" r="2.4" fill="#FDFDFB"/><circle cx="34" cy="32" r="3.6" fill="#FDFDFB"/></svg>
  <b>Zento AI</b>
  <a class="gh" href="https://github.com/Zento21/Zento-AI-Self-Media-Workplace_demo">GitHub ↗</a>
  <span class="demo-tag">演示数据</span>
</header>

<div class="shell">
  <aside class="side">
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
<button class="sfab" onclick="CK.open(true)" aria-label="搜索（/ 或 ⌘K）" title="搜索 · / 或 ⌘K"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></button>
    <div class="scrim" id="scrim" onclick="toggleSide(false)"></div>
    <div class="mbar">
      <button class="mbtn" onclick="toggleSide(true)" aria-label="打开导航"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
      <span class="mb-brand">Zento AI</span>
      <button class="mbtn" onclick="CK.open(true)" aria-label="命令面板"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 9 13.5 12 9 15"/><path d="M20 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z"/></svg></button>
    </div>
    <section class="view on" id="v-home">
      <div class="feedwrap">
        <div>
          <div class="pills" id="feedCats"></div>
          <div id="feed"></div>
        </div>
        <aside class="hotside">
          <div class="hot-title">来源状态</div>
          <div class="fmeta" style="margin-bottom:8px" id="srcHealthHint"></div>
          <div id="srcList"></div>
          <div class="hot-title" style="margin-top:18px">近 14 天新增</div>
          <div class="bars" id="trendBars"></div>
          <div class="legend"><span>较早</span><span>最近</span></div>
          <div class="hot-title" style="margin-top:18px">当前热点</div>
          <div id="hotrank"></div>
        </aside>
      </div>
    </section>

function coFilterSet(s){ coFilter = (coFilter === s ? null : s); renderCoPipeline(); renderCoOrders(); }
function renderCoOrders(){

function coAdvance(i, action){

    gate_pass:'待审', review_pass:'待发', publish:'已发布', start_review:'复盘中', close:'已归档'};
  const to = flow[action];

const CK = {
  items: [], sel: 0,
  build(){ this.items = [
    {l:'情报 · 热点聚合', k:'导航', f:() => go('v-home', document.querySelectorAll('.nav button')[0])},
    {l:'创作 · 一站式工作台', k:'导航', f:() => go('v-orders', document.querySelectorAll('.nav button')[1])},
    {l:'运营 · 稿件与平台数据', k:'导航', f:() => go('v-intel', document.querySelectorAll('.nav button')[2])},
    {l:'同步数据', k:'动作', f:() => toast('演示：sync.py --once 同步 86 个分级信源')},
    {l:'新建内容单', k:'动作', f:() => { go('v-orders', document.querySelectorAll('.nav button')[1]); toast('演示：手工建单'); }},
    {l:'待审 · 《机床边的下一班》', k:'内容单', f:() => orderDetail('CO-20261024-003')},
    {l:'草稿中 · Kimi K3.1 Pro 分水岭', k:'内容单', f:() => orderDetail('CO-20261024-002')},
    {l:'设置 · 低频工具 · 快捷键', k:'动作', f:() => toast('演示：低频工具都收在这里')},
  ]; this.sel = 0; },
  open(force){ const el = document.getElementById('ck');
    const on = force !== undefined ? force : !el.classList.contains('open');
    if (on){ this.build(); el.classList.add('open'); const i = document.getElementById('cki'); i.value = ''; this.render(); setTimeout(() => i.focus(), 0); }
    else { el.classList.remove('open'); const i = document.getElementById('cki'); if (i) i.blur(); } },
  render(){ const q = document.getElementById('cki').value.toLowerCase();
    this.filtered = this.items.filter(x => !q || (x.l + x.k).toLowerCase().includes(q));
    this.sel = Math.min(this.sel, Math.max(0, this.filtered.length - 1));
    document.getElementById('ckl').innerHTML = this.filtered.map((x, i) =>
      `<div class="ci${i === this.sel ? ' sel' : ''}" data-i="${i}"><span>${x.l}</span><span class="k">${x.k}</span></div>`).join('') || '<div class="ci">没有匹配</div>'; },
  run(i){ const x = this.filtered[i]; if (!x) return; this.open(false); x.f(); }
};
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); CK.open(); return; }
  if (e.key === '/' && !document.getElementById('ck').classList.contains('open') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); CK.open(true); }
  if (e.key === '\\'){ togglePanel(); }
  if (!document.getElementById('ck').classList.contains('open')) return;
  if (e.key === 'Escape') CK.open(false);
  else if (e.key === 'ArrowDown'){ e.preventDefault(); CK.sel = Math.min(CK.sel + 1, CK.filtered.length - 1); CK.render(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); CK.sel = Math.max(CK.sel - 1, 0); CK.render(); }
  else if (e.key === 'Enter'){ e.preventDefault(); CK.run(CK.sel); }
});
document.addEventListener('click', e => {
  const it = e.target.closest('.ci'); if (it){ CK.run(Number(it.dataset.i)); return; }
});
document.getElementById('cki').addEventListener('input', () => { CK.sel = 0; CK.render(); });
